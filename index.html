<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceChat</title><style>
:root{font-family:system-ui,sans-serif;color:#e9f0ff;background:#101827}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.panel{width:min(100%,480px);padding:26px;border-radius:22px;background:#1b2940;box-shadow:0 18px 60px #0004}h1{margin:0 0 8px}p{color:#afc0dc}label{display:block;margin:18px 0 8px}input,select,button{font:inherit;border-radius:10px;padding:13px;border:1px solid #52627c}input,select{width:100%;background:#0e1b2e;color:white}button{cursor:pointer;background:#3975ef;color:white;border:0;font-weight:650}button:disabled{opacity:.4;cursor:not-allowed}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.secondary{background:#34445d}.danger{background:#b93b54}.status{padding:14px;background:#101d30;border-radius:10px;min-height:50px;overflow-wrap:anywhere}.room{font-weight:700;letter-spacing:1px;overflow-wrap:anywhere}small{color:#9fb2d0}audio{display:none}.chat{margin-top:18px;border-top:1px solid #52627c;padding-top:14px}.chatlog{height:240px;overflow-y:auto;background:#0e1b2e;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:85%;padding:9px 12px;border-radius:12px;background:#34445d;overflow-wrap:anywhere;align-self:flex-start;white-space:pre-wrap}.bubble.mine{align-self:flex-end;background:#2459b4}.bubble small{display:block;text-align:right;font-size:10px;margin-top:4px}.chatbar{display:flex;gap:8px;margin-top:10px}.chatbar input{min-width:0;flex:1}.chatbar button{flex-shrink:0}
</style></head><body><main class="panel"><h1>🎙️ VoiceChat</h1><p id="intro">2人で音声通話</p><label for="language">Language / 言語</label><select id="language"><option value="ja">日本語</option><option value="zh">中文</option><option value="en">English</option></select><label for="roomInput" id="roomLabel">ルームID</label><input id="roomInput" placeholder="ルームIDを入力" autocomplete="off" spellcheck="false"><div class="actions"><button id="create">ルーム作成</button><button id="join">参加</button><button id="mute" class="secondary" disabled>ミュート</button><button id="hangup" class="danger" disabled>終了</button></div><p class="room" id="roomDisplay"></p><div class="status" id="status" role="status">準備完了</div><p><small id="notice">HTTPSとマイクの許可が必要です。2台の端末でテストしてください。</small></p><section class="chat"><h2 id="chatTitle">チャット</h2><div id="chatlog" class="chatlog" role="log" aria-live="polite"></div><form id="chatForm" class="chatbar"><input id="chatInput" maxlength="2000" placeholder="メッセージを入力" disabled autocomplete="off"><button id="send" type="submit" disabled>送信</button></form></section><audio id="remoteAudio" autoplay playsinline></audio></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,doc,setDoc,updateDoc,addDoc,onSnapshot,getDoc,deleteDoc,serverTimestamp,query,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
// REPLACE with your Firebase project web configuration
const firebaseConfig={apiKey:'REPLACE_ME',authDomain:'REPLACE_ME',projectId:'REPLACE_ME',appId:'REPLACE_ME'};
const $=id=>document.getElementById(id);
const messages={ja:{intro:'2人で音声通話',room:'ルームID',placeholder:'ルームIDを入力',create:'ルーム作成',join:'参加',mute:'ミュート',unmute:'ミュート解除',hangup:'終了',ready:'準備完了',waiting:'相手の参加を待っています',connecting:'接続中…',connected:'通話中',ended:'通話終了',chat:'チャット',chatPlaceholder:'メッセージを入力',send:'送信',notice:'HTTPSとマイクの許可が必要です。2台の端末でテストしてください。',invalid:'ルームIDを入力してください',notfound:'ルームが見つかりません',occupied:'このルームは使用中です'},zh:{intro:'双人语音通话',room:'房间ID',placeholder:'输入房间ID',create:'创建房间',join:'加入房间',mute:'静音',unmute:'取消静音',hangup:'挂断',ready:'准备就绪',waiting:'等待对方加入',connecting:'连接中…',connected:'通话中',ended:'通话已结束',chat:'文字聊天',chatPlaceholder:'输入消息',send:'发送',notice:'需要HTTPS和麦克风权限，请使用两台设备测试。',invalid:'请输入房间ID',notfound:'找不到房间',occupied:'房间已被占用'},en:{intro:'Two-person voice calls',room:'Room ID',placeholder:'Enter room ID',create:'Create room',join:'Join',mute:'Mute',unmute:'Unmute',hangup:'Hang up',ready:'Ready',waiting:'Waiting for the other person',connecting:'Connecting…',connected:'In call',ended:'Call ended',chat:'Text chat',chatPlaceholder:'Type a message',send:'Send',notice:'HTTPS and microphone permission required. Test with two devices.',invalid:'Enter a room ID',notfound:'Room not found',occupied:'Room already in use'}};
let lang='ja',db,auth,pc,localStream,roomRef,unsubs=[],isCaller=false,muted=false,active=false;
const t=k=>messages[lang][k]; const status=s=>$('status').textContent=s;
function translate(){lang=$('language').value;document.documentElement.lang=lang;$('intro').textContent=t('intro');$('roomLabel').textContent=t('room');$('roomInput').placeholder=t('placeholder');$('create').textContent=t('create');$('join').textContent=t('join');$('mute').textContent=t(muted?'unmute':'mute');$('hangup').textContent=t('hangup');$('notice').textContent=t('notice');$('chatTitle').textContent=t('chat');$('chatInput').placeholder=t('chatPlaceholder');$('send').textContent=t('send');if(!active)status(t('ready'));}
$('language').addEventListener('change',translate);
function buttons(inCall){$('create').disabled=inCall;$('join').disabled=inCall;$('mute').disabled=!inCall;$('hangup').disabled=!inCall;$('chatInput').disabled=!inCall;$('send').disabled=!inCall;}
async function setup(){if(firebaseConfig.apiKey==='REPLACE_ME')throw Error('Set firebaseConfig in index.html');const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);await signInAnonymously(auth);}
const ready=setup().catch(e=>{status(e.message);throw e});
async function begin(){await ready;localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream.getTracks().forEach(track=>pc.addTrack(track,localStream));pc.ontrack=e=>{$('remoteAudio').srcObject=e.streams[0];$('remoteAudio').play().catch(()=>status('Tap the page to enable audio'));};pc.onconnectionstatechange=()=>{if(pc?.connectionState==='connected')status(t('connected'));else if(pc?.connectionState==='failed')status('Connection failed — TURN may be required');else if(pc?.connectionState==='disconnected')status(t('connecting'));};active=true;buttons(true);status(t('connecting'));}
function listenCandidates(name){const seen=new Set();unsubs.push(onSnapshot(collection(roomRef,name),snap=>{snap.docChanges().forEach(change=>{if(change.type==='added'&&!seen.has(change.doc.id)){seen.add(change.doc.id);pc?.addIceCandidate(new RTCIceCandidate(change.doc.data())).catch(console.error);}});}));}
function listenChat(){
  $('chatlog').replaceChildren();
  const q=query(collection(roomRef,'messages'),orderBy('createdAt','asc'),limit(100));
  unsubs.push(onSnapshot(q,snap=>{const log=$('chatlog');log.replaceChildren();snap.forEach(d=>{const data=d.data();const bubble=document.createElement('div');bubble.className='bubble'+(data.sender===auth.currentUser.uid?' mine':'');const body=document.createElement('span');body.textContent=data.text||'';const time=document.createElement('small');time.textContent=data.createdAt?.toDate?.().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})||'';bubble.append(body,time);log.append(bubble);});log.scrollTop=log.scrollHeight;},console.error));
}
$('chatForm').addEventListener('submit',async e=>{e.preventDefault();const input=$('chatInput');const value=input.value.trim();if(!active||!roomRef||!value)return;input.disabled=true;try{await addDoc(collection(roomRef,'messages'),{text:value,sender:auth.currentUser.uid,createdAt:serverTimestamp()});input.value='';}catch(err){status(err.message);}finally{input.disabled=false;input.focus();}});
function publishCandidates(name){pc.onicecandidate=e=>{if(e.candidate&&roomRef)addDoc(collection(roomRef,name),e.candidate.toJSON()).catch(console.error);};}
async function create(){if(active)return;try{await begin();isCaller=true;roomRef=doc(collection(db,'rooms'));publishCandidates('callerCandidates');const offer=await pc.createOffer();await pc.setLocalDescription(offer);await setDoc(roomRef,{offer:{type:offer.type,sdp:offer.sdp},createdBy:auth.currentUser.uid,createdAt:serverTimestamp()});$('roomInput').value=roomRef.id;$('roomDisplay').textContent=roomRef.id;status(t('waiting'));unsubs.push(onSnapshot(roomRef,async snap=>{const data=snap.data();if(!snap.exists()){await hangup(false);return;}if(data?.answer&&!pc.currentRemoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(data.answer));}}));listenCandidates('calleeCandidates');listenChat();}catch(e){status(e.message);await hangup(false,true);}}
async function join(){if(active)return;const id=$('roomInput').value.trim();if(!id){status(t('invalid'));return;}try{await ready;roomRef=doc(db,'rooms',id);const snap=await getDoc(roomRef);if(!snap.exists()){status(t('notfound'));roomRef=null;return;}if(snap.data().answer){status(t('occupied'));roomRef=null;return;}await begin();isCaller=false;publishCandidates('calleeCandidates');await pc.setRemoteDescription(new RTCSessionDescription(snap.data().offer));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await updateDoc(roomRef,{answer:{type:answer.type,sdp:answer.sdp}});$('roomDisplay').textContent=id;listenCandidates('callerCandidates');listenChat();unsubs.push(onSnapshot(roomRef,async s=>{if(!s.exists())await hangup(false);}));}catch(e){status(e.message);await hangup(false,true);}}
async function hangup(remove=true,keepError=false){const oldRef=roomRef;const caller=isCaller;unsubs.forEach(fn=>fn());unsubs=[];if(pc){pc.onicecandidate=null;pc.ontrack=null;pc.close();pc=null;}localStream?.getTracks().forEach(track=>track.stop());localStream=null;$('remoteAudio').srcObject=null;roomRef=null;active=false;isCaller=false;muted=false;buttons(false);$('roomDisplay').textContent='';$('chatlog').replaceChildren();$('chatInput').value='';$('mute').textContent=t('mute');if(!keepError)status(t('ended'));if(remove&&caller&&oldRef){try{await deleteDoc(oldRef);}catch(e){console.error(e);}}}
$('create').onclick=create;$('join').onclick=join;$('hangup').onclick=()=>hangup();$('mute').onclick=()=>{if(!localStream)return;muted=!muted;localStream.getAudioTracks().forEach(track=>track.enabled=!muted);$('mute').textContent=t(muted?'unmute':'mute');};
</script></body></html>
